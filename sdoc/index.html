        color: #90aeb7;
        background: transparent;
        border: 0;
        border-bottom: 3px solid transparent;
        padding: 12px 17px 13px;
        white-space: nowrap;
        font-size: 13px;

        border-bottom-color: #78edcf;
        background: #15353e;
      }

        background: #123039;

      }

        min-height: 0;

        height: 100%;

    <script>
      const tabs = Array.from(document.querySelectorAll('[role="tab"]'));
      const standaloneLink = document.querySelector('#open-document');
      function activateDocument(key) {
        const selected = tabs.find((tab) => tab.dataset.document === key) || tabs[0];
        tabs.forEach((tab) => {
          const active = tab === selected;
          tab.setAttribute('aria-selected', String(active));
          tab.tabIndex = active ? 0 : -1;
          const panel = document.getElementById(tab.getAttribute('aria-controls'));
          panel.hidden = !active;
          if (active) {
            const frame = panel.querySelector('iframe');
            // 首次激活才加载，切换时保留已加载页面的滚动位置和主题选择。
            if (!frame.hasAttribute('src')) frame.setAttribute('src', frame.dataset.src);
            standaloneLink.href = frame.dataset.src;
            standaloneLink.setAttribute('aria-label', '单独打开：' + frame.title);
            document.title = tab.textContent + ' · 海序空间项目文档';
          }
        });
      }
      function navigateToTab(tab) {
        const key = tab.dataset.document;
        activateDocument(key);
        if (location.hash !== '#' + key) location.hash = key;
      }
      tabs.forEach((tab, index) => {
        tab.addEventListener('click', () => navigateToTab(tab));
        tab.addEventListener('keydown', (event) => {
          let target;
          if (event.key === 'ArrowRight') target = tabs[(index + 1) % tabs.length];
          if (event.key === 'ArrowLeft') target = tabs[(index - 1 + tabs.length) % tabs.length];
          if (event.key === 'Home') target = tabs[0];
          if (event.key === 'End') target = tabs[tabs.length - 1];
          if (!target) return;
          event.preventDefault();
          target.focus();
          navigateToTab(target);
        });
      });
      addEventListener('hashchange', () => activateDocument(location.hash.slice(1)));
      activateDocument(location.hash.slice(1));
    </script>
